<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is DownDetector Down? - downdetectordowndetector.com</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Is DownDetector Down?</h1>
            <p class="subtitle">Checking the status of downdetector.com</p>
        </header>
        
        <main>
            <div class="status-card" id="statusCard">
                <div class="status-icon" id="statusIcon">
                    <div class="spinner"></div>
                </div>
                <div class="status-text" id="statusText">Checking status...</div>
                <div class="status-details" id="statusDetails"></div>
            </div>
            
            <div class="info-section">
                <h2>About</h2>
                <p>This website monitors the availability of <strong>downdetector.com</strong>.</p>
                <p>Status is checked automatically every <span id="checkInterval">30</span> seconds.</p>
            </div>
            
            <div class="last-check">
                <p>Last checked: <span id="lastCheck">Never</span></p>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2024 downdetectordowndetector.com</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
